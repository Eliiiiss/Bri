    <body>
        <div id="app">

            <section id="view-main" class="view active">
                <div id="scene">
                    <div id="letter-card">

                        <div class="letter-page" data-page="2">

                    <div id="envelope">
                        <div class="flap"></div>
                        <div class="pocket"></div>
                        <div class="bow">
                            <div class="bow-loop left"></div>
                            <div class="bow-loop right"></div>
                            <div class="bow-knot"></div>
                            <div class="bow-charm"></div>
                        </div>
                    </div>

                    <a
                        id="bouquet"
                        href="flores.html"
                        aria-label="Ramo de flores"
                    >
                        <img
                            src="assets/boton-flores.png"
                            alt="Ramo de flores"
                        />
                    </a>

                    <div class="gifts-row">
                        <a href="netflix.html" class="gift-icon">
                            <span class="gift-bow"></span>
                            <img
                                class="gift-img"
                                src="assets/netflix.png"
                                alt=""

                        </a>
                        <a href="favoritos.html" class="gift-icon">
                            <span class="gift-bow"></span>
                            <svg
                                class="gift-svg"
                                viewBox="0 0 24 24"
                                fill="white"

                        <a href="hachi.html" class="gift-icon">
                            <span class="gift-bow"></span>
                            <img
                                class="gift-img"

                            />

                        <a href="spotify.html" class="gift-icon">
