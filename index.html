<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Para ti</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div id="app">
            <div id="home-petals"></div>

            <section id="view-main" class="view active">
                <div id="scene">
                    <div id="letter-card">
                        <div class="letter-page" data-page="1">
                            <p class="letter-greeting">Para ti</p>
                            <p class="letter-body">
                                lorem ipsum dolor sit amet, consectetur
                                adipiscing elit. lorem ipsum dolor sit amet,
                                consectetur adipiscing elit. lorem
                            </p>
                        </div>
                        <div class="letter-page" data-page="2">
                            <p class="letter-body">
                                lorem ipsum dolor sit amet, consectetur
                                adipiscing elit.
                            </p>
                        </div>

                        <div class="letter-page" data-page="3">
                            <p class="letter-body">
                                lorem ipsum dolor sit amet, consectetur
                                adipiscing elit.
                            </p>
                        </div>
                    </div>

                    <div
                        class="letter-navigation"
                        aria-label="Navegación de la carta"
                    >
                        <button
                            class="page-prev"
                            aria-label="Página anterior"
                            type="button"
                        >
                            ‹
                        </button>
                        <button
                            class="page-next"
                            aria-label="Siguiente página"
                            type="button"
                        >
                            ›
                        </button>
                    </div>

                    <div id="envelope">
                        <div class="flap"></div>
                        <div class="pocket"></div>
                        <div class="bow">
                            <div class="bow-loop left"></div>
                            <div class="bow-loop right"></div>
                            <div class="bow-knot"></div>
                            <div class="bow-charm"></div>
                        </div>
                    </div>

                    <a
                        id="bouquet"
                        href="flores.html"
                        aria-label="Ramo de flores"
                    >
                        <img
                            src="assets/boton-flores.png"
                            alt="Ramo de flores"
                        />
                    </a>

                    <div class="gifts-row">
                        <a href="netflix.html" class="gift-icon">
                            <span class="gift-bow"></span>
                            <img
                                class="gift-img"
                                src="assets/netflix.png"
                                alt=""
                            />
                        </a>
                        <a href="hachi.html" class="gift-icon">
                            <span class="gift-bow"></span>
                            <img
                                class="gift-img"
                                src="assets/nana.jpg"
                                alt=""
                            />
                        </a>
                        <a href="spotify.html" class="gift-icon">
                            <span class="gift-bow"></span>
                            <img
                                class="gift-img"
                                src="assets/spotify.png"
                                alt=""
                            />
                        </a>
                    </div>
                </div>
                <p id="tap-hint">Toca el sobre</p>
            </section>
        </div>

        <script src="script.js"></script>
    </body>
</html>
